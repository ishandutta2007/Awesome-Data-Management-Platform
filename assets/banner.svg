<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 48px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .node { animation: pulse-node 4s ease-in-out infinite; transform-origin: center; }
    .pill1 { animation: float-pill 6s ease-in-out infinite; }
    .pill2 { animation: float-pill 7s ease-in-out infinite 1s; }
    .pill3 { animation: float-pill 5s ease-in-out infinite 2s; }
    .flow-line { stroke-dasharray: 8 8; animation: dash-flow 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />

  <!-- Background Dynamic Network Connections (behind text) -->
  <g opacity="0.25">
    <line x1="150" y1="80" x2="350" y2="140" stroke="#6366f1" stroke-width="2" class="flow-line" />
    <line x1="350" y1="140" x2="250" y2="280" stroke="#a855f7" stroke-width="2" class="flow-line" />
    <line x1="850" y1="90" x2="1000" y2="180" stroke="#ec4899" stroke-width="2" class="flow-line" />
    <line x1="1000" y1="180" x2="900" y2="290" stroke="#6366f1" stroke-width="2" class="flow-line" />
    <circle cx="150" cy="80" r="6" fill="#818cf8" class="node" />
    <circle cx="350" cy="140" r="8" fill="#c084fc" class="node" />
    <circle cx="250" cy="280" r="7" fill="#f472b6" class="node" />
    <circle cx="850" cy="90" r="6" fill="#818cf8" class="node" />
    <circle cx="1000" cy="180" r="9" fill="#ec4899" class="node" />
    <circle cx="900" cy="290" r="7" fill="#818cf8" class="node" />
  </g>

  <!-- Animated Accent Pills (Background decorative elements) -->
  <g opacity="0.35">
    <rect class="pill1" x="80" y="240" width="140" height="36" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text class="pill1 badge-text" x="150" y="263" text-anchor="middle" fill="#818cf8">📊 Identity Graphs</text>

    <rect class="pill2" x="960" y="70" width="150" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text class="pill2 badge-text" x="1035" y="93" text-anchor="middle" fill="#c084fc">🔒 Privacy Safe</text>

    <rect class="pill3" x="940" y="240" width="160" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text class="pill3 badge-text" x="1020" y="263" text-anchor="middle" fill="#f472b6">⚡ Ad Activation</text>
  </g>

  <!-- Main Title & Foreground Text (Always Clear & Unobstructed) -->
  <g transform="translate(600, 140)">
    <!-- Top Category Tag -->
    <rect x="-140" y="-75" width="280" height="30" rx="15" fill="url(#accent)" opacity="0.9" />
    <text x="0" y="-55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="1">CURATED DATA ECOSYSTEM</text>
    
    <!-- Main Title -->
    <text class="title" x="0" y="15" text-anchor="middle" filter="url(#glow)">Awesome Data Management Platform</text>
    
    <!-- Subtitle -->
    <text class="subtitle" x="0" y="60" text-anchor="middle">The Ultimate Ecosystem for Enterprise DMPs, CDPs, &amp; Open-Source Audience Infrastructure</text>

    <!-- Stat/Feature Highlights -->
    <g transform="translate(0, 115)">
      <rect x="-240" y="-20" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="-170" y="1" text-anchor="middle" class="badge-text">🏢 Enterprise SaaS</text>

      <rect x="-70" y="-20" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="0" y="1" text-anchor="middle" class="badge-text">⚡ Open Source</text>

      <rect x="100" y="-20" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="170" y="1" text-anchor="middle" class="badge-text">🎯 Ad Activation</text>
    </g>
  </g>
</svg>
